version: "20.10.16"
services:
  client:
    build: ./client
    container_name: client_c
    ports:
      - '3000:3000'
    volumes:
      - ./client:/client
      - /client/node_modules
    stdin_open: true
    tty: true
  server:
    build: ./server
    container_name: server_c
    ports:
      - '5001:5001'
    volumes:
      - ./server:/server
      - /server/node_modules
    environment:
      - DB=${DB}
 
